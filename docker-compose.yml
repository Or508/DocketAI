services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docket
      POSTGRES_PASSWORD: docket
      POSTGRES_DB: docketai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docket -d docketai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant:/qdrant/storage

  # S3-compatible object storage for local development. MinIO no longer publishes
  # community images, so this uses RustFS. Credentials below are dev-only defaults.
  rustfs:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${S3_DEV_ACCESS_KEY:-docket}
      RUSTFS_SECRET_KEY: ${S3_DEV_SECRET_KEY:-docket-local-dev}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - objects:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Creates the private bucket once. Safe to rerun.
  storage-setup:
    image: amazon/aws-cli:2.39.2
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_DEV_ACCESS_KEY:-docket}
      AWS_SECRET_ACCESS_KEY: ${S3_DEV_SECRET_KEY:-docket-local-dev}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket docketai 2>/dev/null
        || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket docketai
    restart: "no"

  api:
    profiles: ["app"]
    build: ./apps/api
    environment: &app-env
      DATABASE_URL: postgresql+asyncpg://docket:docket@postgres:5432/docketai
      REDIS_URL: redis://redis:6379/0
      QUEUE_ENABLED: "true"
      QDRANT_URL: http://qdrant:6333
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-004}
      STORAGE_BACKEND: s3
      S3_BUCKET: docketai
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${S3_DEV_ACCESS_KEY:-docket}
      S3_SECRET_ACCESS_KEY: ${S3_DEV_SECRET_KEY:-docket-local-dev}
      AUTO_CREATE_SCHEMA: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      SIGNING_LINK_TTL_HOURS: ${SIGNING_LINK_TTL_HOURS:-72}
      SIGNING_LINK_DOWNLOAD_HOURS: ${SIGNING_LINK_DOWNLOAD_HOURS:-168}
      SIGNING_LINK_MAX_CHAT_TURNS: ${SIGNING_LINK_MAX_CHAT_TURNS:-40}
      CLAMAV_HOST: ${CLAMAV_HOST:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      storage-setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Optional. Stays off unless the stack is started with --profile scan and
  # CLAMAV_HOST is set, for example CLAMAV_HOST=clamav.
  clamav:
    profiles: ["scan"]
    image: clamav/clamav:1.5.4
    ports:
      - "127.0.0.1:3310:3310"

  worker:
    profiles: ["app"]
    build: ./apps/api
    command: ["arq", "app.workers.tasks.WorkerSettings"]
    environment: *app-env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "arq", "app.workers.tasks.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pgdata:
  qdrant:
  redisdata:
  objects:
