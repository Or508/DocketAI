[project]
name = "docketai-api"
version = "0.1.0"
description = "DocketAI document ingestion, gap analysis, form fill, and signing API."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "aiosqlite>=0.20.0",
  "alembic>=1.14.0",
  "python-multipart>=0.0.20",
  "pymupdf>=1.25.1",
  "pypdf>=5.1.0",
  "reportlab>=4.2.5",
  "arabic-reshaper>=3.0.0",
  "python-bidi>=0.6.6",
  "google-genai>=1.2.0",
  "qdrant-client>=1.12.1",
  "arq>=0.26.1",
  "redis>=5.2.1",
  "tzdata>=2024.2",
  "argon2-cffi>=23.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "httpx>=0.28.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
